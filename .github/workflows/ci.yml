name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Oasis configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint

      - name: Validate shell syntax
        run: bash -n build.sh scripts/*.sh

      - name: Shellcheck
        run: shellcheck build.sh scripts/*.sh

      - name: Validate Python
        run: python3 -m py_compile scripts/*.py

      - name: Validate YAML
        run: yamllint -d relaxed .github/workflows systemd config/authentik/providers.yaml.example

      - name: Validate Compose
        run: docker compose --env-file .env.example --profile local --profile production config

      - name: Scan for likely committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
