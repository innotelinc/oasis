name: Release Oasis

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to cut (default: bump minor from the last release)'
        required: false
        default: ''
        type: string
      zimbra_version:
        description: 'Upstream Zimbra X.Y.Z version to build'
        required: true
        default: '10.1.16'
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oasis/zimbra-builder
  # Oasis release tags are independent of the upstream Zimbra release. Keep the
  # default in version control so releases work without repository settings.
  # Override deliberately with workflow_dispatch inputs.
  RELEASE_ZIMBRA_VERSION: '10.1.16'

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and Compose
        run: |
          bash -n build.sh scripts/*.sh
          python3 -m py_compile scripts/*.py
          docker compose --env-file .env.example --profile local --profile production config

  release:
    name: Build and publish release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            LAST="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
            LAST="${LAST#v}"
            if [ -z "$LAST" ]; then
              VERSION="0.1.0"
            else
              MAJOR="${LAST%%.*}"; REST="${LAST#*.}"; MINOR="${REST%%.*}"
              VERSION="${MAJOR}.$((MINOR + 1)).0"
            fi
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad release version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release: v$VERSION"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Zimbra builder version
        run: |
          zimbra_version="${{ inputs.zimbra_version || env.RELEASE_ZIMBRA_VERSION }}"
          if ! [[ "$zimbra_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Zimbra version must be X.Y.Z, got: $zimbra_version" >&2
            exit 1
          fi
          echo "RELEASE_ZIMBRA_VERSION=$zimbra_version" >> "$GITHUB_ENV"

      - name: Build and push builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ubuntu:22.04
            ZIMBRA_VERSION=${{ inputs.zimbra_version || env.RELEASE_ZIMBRA_VERSION }}
            BUILD_UID=1000
            BUILD_GID=1000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: oasis-zimbra-builder-v${{ steps.version.outputs.version }}.spdx.json
          output-file: oasis-zimbra-builder-v${{ steps.version.outputs.version }}.spdx.json

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      # Release gate: fail on CRITICAL/HIGH package vulnerabilities. The
      # builder image ships Zimbra's own /etc/maven/settings.xml template,
      # whose placeholder credentials trip trivy's secret heuristics — scan
      # vulnerabilities here and let the SBOM cover provenance.
      - name: Scan image (vulnerabilities)
        run: |
          trivy image \
            --scanners vuln \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}"

      - name: Record release build configuration
        run: |
          printf 'Oasis release: v%s\nZimbra builder version: %s\n' \
            "${{ steps.version.outputs.version }}" "$RELEASE_ZIMBRA_VERSION" > release-build-info.txt

      - name: Package Compose bundle
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p "dist/oasis-${version}"
          cp -a docker-compose.yml .env.example README.md config docs scripts systemd Dockerfile build.sh "dist/oasis-${version}/"
          tar -C dist -czf "oasis-${version}-compose.tar.gz" "oasis-${version}"
          sha256sum "oasis-${version}-compose.tar.gz" > "oasis-${version}-compose.tar.gz.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            oasis-*-compose.tar.gz
            oasis-*.spdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            oasis-*-compose.tar.gz
            oasis-*-compose.tar.gz.sha256
            oasis-*.spdx.json
