# ┌──────────────────────────────────────────────────────────┐
# │  Zimbra FOSS Builder — docker-compose.yml                │
# │  Easy mode: docker compose up --build                    │
# └──────────────────────────────────────────────────────────┘

services:
  zimbra-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${BASE_IMAGE:-ubuntu:22.04}"
        ZIMBRA_VERSION: "${ZIMBRA_VERSION:-latest}"
        BUILD_UID: "${BUILD_UID:-1000}"
        BUILD_GID: "${BUILD_GID:-1000}"
        TZ: "${TZ:-Etc/UTC}"
    image: "zimbra-builder:local-zimbra${ZIMBRA_VERSION:-latest}"
    container_name: zimbra-builder
    environment:
      - ZIMBRA_VERSION=${ZIMBRA_VERSION:-latest}
      - FORCE_REBUILD=${FORCE_REBUILD:-false}
    volumes:
      - ./builds:/home/build/installer-build/BUILDS:rw

    # Public DNS fallback — hosts whose /etc/resolv.conf points at the
    # systemd-resolved stub (127.0.0.53) can't resolve from inside the
    # container. Override via .env (DOCKER_DNS1 / DOCKER_DNS2), e.g. for
    # corporate/VPN DNS.
    dns:
      - ${DOCKER_DNS1:-8.8.8.8}
      - ${DOCKER_DNS2:-1.1.1.1}

    command: ["--build"]
    
    # Resource limits (optional — uncomment to constrain)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G
    #       cpus: '4'
